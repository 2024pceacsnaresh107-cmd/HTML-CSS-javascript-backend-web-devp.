<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <h1 id="heading">Hello Students</h1> 
    <p id="message">Welcome to javascript.</p>
    <button onclick="changeContent()"> Click me</button>
    <script>
        function changeContent(){
            document.getElementById("heading").textContent = "Welcome to DOM"
            document.getElementById("message").textContent = "Hello"
        }
    </script>
</body>
</html>
